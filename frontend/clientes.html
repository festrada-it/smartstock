<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock - Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="tw-bg-slate-50">
<div class="tw-flex">
    <aside id="sidebar" class="tw-w-64 tw-shrink-0 tw-border-r tw-bg-white"></aside>

    <main class="tw-flex-1 tw-p-8">
        <div class="tw-mb-6 tw-flex tw-items-center tw-justify-between">
            <h1 class="tw-m-0 tw-text-2xl tw-font-bold tw-text-slate-800">Clientes</h1>
            <button id="btn-nuevo" class="btn btn-marca d-none">+ Nuevo cliente</button>
        </div>
        <div id="mensajes"></div>

        <div class="tarjeta">
            <div class="tw-mb-4 tw-flex tw-flex-wrap tw-gap-3">
                <input id="filtro-texto" type="search" class="form-control tw-max-w-xs" placeholder="Buscar por nombre">
                <select id="filtro-calidad" class="form-select tw-max-w-[14rem]">
                    <option value="">Todas las calidades</option>
                    <option value="BUENA">Buena</option>
                    <option value="REGULAR">Regular</option>
                    <option value="MALA">Mala</option>
                </select>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Teléfono</th>
                            <th>Calidad</th>
                            <th>Clasificación</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-clientes">
                        <tr><td colspan="5" class="text-center text-muted">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal detalle: datos, historial de pedidos y productos/marcas que compra -->
<div class="modal fade" id="modal-detalle" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="detalle-nombre"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <dl class="row tw-mb-4" id="detalle-datos"></dl>

                <h6 class="tw-font-semibold">Marcas que compra</h6>
                <div id="detalle-marcas" class="tw-mb-3 tw-flex tw-flex-wrap tw-gap-2"></div>
                <h6 class="tw-font-semibold">Productos que compra</h6>
                <div class="table-responsive tw-mb-4">
                    <table class="table table-sm align-middle mb-0">
                        <thead>
                            <tr><th>Producto</th><th>Marca</th><th class="text-end">Unidades</th><th class="text-end">Última compra</th></tr>
                        </thead>
                        <tbody id="detalle-productos" class="tw-tabular-nums"></tbody>
                    </table>
                </div>

                <h6 class="tw-font-semibold">Historial de pedidos <span id="detalle-total-pedidos" class="tw-font-normal tw-text-slate-500"></span></h6>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead>
                            <tr><th>#</th><th>Fecha</th><th>Estado</th><th class="text-end">Total</th></tr>
                        </thead>
                        <tbody id="detalle-pedidos" class="tw-tabular-nums"></tbody>
                    </table>
                </div>
                <button id="btn-mas-pedidos" class="btn btn-sm btn-outline-secondary tw-mt-2 d-none">Ver más</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal alta / edición de cliente (solo Admin) -->
<div class="modal fade" id="modal-cliente" tabindex="-1">
    <div class="modal-dialog">
        <form id="form-cliente" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="titulo-modal-cliente">Nuevo cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="cliente-id">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="cliente-nombre">Nombre</label>
                        <input id="cliente-nombre" class="form-control" required maxlength="150">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="cliente-direccion">Dirección</label>
                        <input id="cliente-direccion" class="form-control" maxlength="255">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="cliente-telefono">Teléfono</label>
                        <input id="cliente-telefono" type="tel" class="form-control" maxlength="50">
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="cliente-calidad">Calidad percibida</label>
                        <select id="cliente-calidad" class="form-select" required>
                            <option value="BUENA">Buena</option>
                            <option value="REGULAR">Regular</option>
                            <option value="MALA">Mala</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="cliente-clasificacion">Clasificación</label>
                        <select id="cliente-clasificacion" class="form-select" required>
                            <option value="5">★★★★★ (5)</option>
                            <option value="4">★★★★☆ (4)</option>
                            <option value="3">★★★☆☆ (3)</option>
                            <option value="2">★★☆☆☆ (2)</option>
                            <option value="1">★☆☆☆☆ (1)</option>
                        </select>
                    </div>
                </div>
                <p class="tw-mb-0 tw-mt-3 tw-text-sm tw-text-slate-500">
                    La clasificación se muestra al armar cada venta para decidir cuánto venderle.
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-marca">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/calificacion.js"></script>
<script src="js/clientes-fuente.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>

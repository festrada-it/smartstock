<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock - Usuarios y parámetros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="tw-bg-slate-50">
<div class="tw-flex">
    <aside id="sidebar" class="tw-w-64 tw-shrink-0 tw-border-r tw-bg-white"></aside>

    <main class="tw-flex-1 tw-p-8">
        <h1 class="tw-mb-6 tw-text-2xl tw-font-bold tw-text-slate-800">Usuarios y parámetros</h1>
        <div id="mensajes"></div>

        <div class="tw-grid tw-grid-cols-1 tw-gap-4 lg:tw-grid-cols-3">
            <section class="tarjeta lg:tw-col-span-2">
                <h2 class="tw-mb-3 tw-text-base tw-font-semibold">Usuarios</h2>
                <table class="table align-middle">
                    <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
                    <tbody id="tabla-usuarios"></tbody>
                </table>
            </section>

            <section class="tarjeta">
                <h2 class="tw-mb-3 tw-text-base tw-font-semibold">Nuevo usuario</h2>
                <form id="form-usuario">
                    <div class="mb-2">
                        <label class="form-label" for="usuario-nombre">Nombre</label>
                        <input id="usuario-nombre" class="form-control" required maxlength="100">
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="usuario-email">Email</label>
                        <input id="usuario-email" type="email" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="usuario-password">Contraseña (mín. 6)</label>
                        <input id="usuario-password" type="password" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="usuario-rol">Rol</label>
                        <select id="usuario-rol" class="form-select">
                            <option value="VENDEDOR">Vendedor / Operador</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>
                    <button class="btn btn-marca tw-w-full">Crear usuario</button>
                </form>
            </section>
        </div>

        <section class="tarjeta tw-mt-6">
            <h2 class="tw-mb-1 tw-text-base tw-font-semibold">Parámetros del módulo predictivo</h2>
            <p class="tw-text-sm tw-text-slate-500">Se usan para clasificar la criticidad de las alertas y calcular el lote de compra sugerido.</p>
            <table class="table align-middle mb-0">
                <thead><tr><th>Parámetro</th><th>Descripción</th><th class="tw-w-40">Valor</th><th></th></tr></thead>
                <tbody id="tabla-parametros"></tbody>
            </table>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock - Ingresar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="tw-flex tw-min-h-screen tw-items-center tw-justify-center tw-bg-gradient-to-br tw-from-marca-claro tw-to-slate-100">
    <main class="tw-w-full tw-max-w-sm tw-rounded-2xl tw-bg-white tw-p-8 tw-shadow-lg">
        <div class="tw-mb-6 tw-text-center">
            <div class="tw-mx-auto tw-mb-3 tw-flex tw-h-14 tw-w-14 tw-items-center tw-justify-center tw-rounded-full tw-bg-marca tw-text-2xl tw-font-bold tw-text-white">S</div>
            <h1 class="tw-text-2xl tw-font-bold tw-text-slate-800">SmartStock</h1>
            <p class="tw-text-sm tw-text-slate-500">Gestión de inventario y predicción de quiebres</p>
        </div>

        <form id="form-login" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="usuario@comercio.com" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <div id="error-login" class="alert alert-danger py-2 d-none"></div>
            <button type="submit" id="btn-ingresar" class="btn btn-marca tw-w-full">Ingresar</button>
        </form>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const sesionExistente = Sesion.obtener();
        if (sesionExistente) window.location.replace(paginaInicio(sesionExistente.rol));

        document.getElementById('form-login').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const error = document.getElementById('error-login');
            const boton = document.getElementById('btn-ingresar');
            error.classList.add('d-none');
            boton.disabled = true;
            try {
                const datos = await coreApi('/auth/login', {
                    method: 'POST',
                    body: {
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    },
                });
                Sesion.guardar(datos);
                // Derivación automática según el rol
                window.location.href = paginaInicio(datos.rol);
            } catch (e) {
                error.textContent = e.message === 'Failed to fetch' ? 'No se pudo conectar con el servidor' : e.message;
                error.classList.remove('d-none');
            } finally {
                boton.disabled = false;
            }
        });
    </script>
</body>
</html>

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  core-service:
    name: Java - core-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-service
    env:
      SMARTSTOCK_INTEGRACION: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartstock
          POSTGRES_USER: smartstock
          POSTGRES_PASSWORD: smartstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstock -d smartstock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Inicializar esquema y datos de prueba
        run: |
          for script in ../database/init/*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U smartstock -d smartstock < "$script"
          done
      - run: chmod +x mvnw && ./mvnw -B verify

  analytics-service:
    name: Python - analytics-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    env:
      SMARTSTOCK_INTEGRACION: 'true'
      DATABASE_URL: postgresql+psycopg://smartstock:smartstock@localhost:5432/smartstock
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartstock
          POSTGRES_USER: smartstock
          POSTGRES_PASSWORD: smartstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstock -d smartstock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v
